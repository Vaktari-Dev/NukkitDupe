# ───────────────────────────────────────
#   NukkitDupe Configuration
#   Author: Vaktari-Dev
# ───────────────────────────────────────

settings:
  # Cooldown in seconds between dupe attempts
  cooldown: 30

  # Default max uses per player per server restart
  default-limit: 10

# ── Groups ─────────────────────────────
# Each group overrides default settings for specific permission groups
# Permission format: nukkitdupe.group.<name>
groups:
  vip:
    cooldown: 15
    limit: 25
  premium:
    cooldown: 5
    limit: 50
  admin:
    cooldown: 0
    limit: -1

# ── Blacklist ──────────────────────────
# Items that cannot be duplicated
# Format: "item_id" or "item_id:damage"
blacklist:
  - "minecraft:barrier"
  - "minecraft:command_block"
  - "minecraft:structure_block"
  - "minecraft:bedrock"
  - "minecraft:end_portal_frame"